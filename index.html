<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10182f" />
  <title>별덕이 — 우주 오리</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="workspace" id="workspace" aria-label="별덕이 놀이터">
      <div class="nebula one"></div>
      <div class="nebula two"></div>
      <div class="stars" aria-hidden="true"></div>
      <div class="hero-copy">
        <span class="eyebrow">STAR DUCK / SCHOOL WEB EDITION</span>
        <h1>지루하면<br><strong>별덕이가 출동.</strong></h1>
        <p>설치 권한 없이 실행. 작업할 때는 작은 떠다니는 창으로 별덕이를 옆에 띄울 수 있어.</p>
      </div>

      <div id="duckLayer" class="duck-layer" aria-live="polite"></div>

      <button id="panelToggle" class="panel-toggle" type="button" aria-expanded="true">☰</button>
      <aside id="controlPanel" class="control-panel">
        <div class="panel-head">
          <div>
            <span class="micro">MISSION CONTROL</span>
            <h2>별덕이 관제실</h2>
          </div>
          <span id="statusDot" class="status-dot"></span>
        </div>

        <div class="stats">
          <div><b id="petCount">0</b><span>쓰다듬</span></div>
          <div><b id="snackCount">0</b><span>별사탕</span></div>
          <div><b id="noteCount">0</b><span>쪽지</span></div>
        </div>

        <div class="button-grid">
          <button data-action="pet">♡ 쓰다듬기</button>
          <button data-action="snack">★ 별사탕</button>
          <button data-action="note">! 수상한 쪽지</button>
          <button data-action="pause">Ⅱ 잠깐 쉬기</button>
        </div>

        <label class="field">행동 모드
          <select id="modeSelect">
            <option value="roam">자유 산책</option>
            <option value="follow">마우스 따라오기</option>
            <option value="focus">집중 모드 · 구석에 앉기</option>
          </select>
        </label>

        <label class="field">이동 속도
          <input id="speedRange" type="range" min="0.45" max="2" value="1" step="0.05" />
        </label>

        <label class="switch-row"><span>가끔 말 걸기</span><input id="talkToggle" type="checkbox" checked /></label>
        <label class="switch-row"><span>별 수집 놀이</span><input id="starToggle" type="checkbox" checked /></label>

        <div class="secondary-actions">
          <button id="fullscreenBtn" type="button">⛶ 전체화면</button>
          <button id="floatingBtn" type="button">▣ 작업용 떠다니는 별덕이</button>
          <button id="installBtn" class="hidden" type="button">＋ 앱 설치</button>
        </div>

        <p id="compatText" class="compat"></p>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
